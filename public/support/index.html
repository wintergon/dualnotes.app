<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual Notes Support</title>
<meta name="description" content="How to reach Dual Notes for help with the app.">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1B1D" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- The Support URL in App Store Connect. App Review (guideline 1.5) wants it to give an easy way to
     reach the developer; support@dualnotes.app is a Cloudflare Email Routing address. -->
<main class="page">
  <div class="site-bar">
    <a class="wordmark" href="/"><img src="/favicon.png" alt="" width="28" height="28">Dual Notes</a>
    <nav aria-label="Site">
      <a href="/support/" aria-current="page">Support</a>
      <a href="/privacy/">Privacy</a>
    </nav>
  </div>

  <header class="title">
    <h1>Support</h1>
    <p class="lead">Something not working, or a question about Dual Notes? Email us.</p>
  </header>

  <div class="contact">
    <a class="address" href="mailto:support@dualnotes.app">support@dualnotes.app</a>
    <p>It helps to say which device you’re on, its iOS version, and what you did just before the problem.</p>
  </div>

  <footer class="site-foot">
    <span>Dual Notes for iPhone and iPad</span>
    <a href="/">Home</a>
    <a href="/privacy/">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
